# Thème « papier et encre », repris d'ESIRPRAC : fond papier chaud, encre presque noire, accent bleu stylo,
# titres en Source Serif 4, texte en Inter. Clair ou sombre selon Windows, comme ESIRPRAC.
# Les mêmes couleurs sont dans osuprog/theme.css (variables --op-…) : changer les deux ensemble.

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["40px", "22px", "18px", "16px", "15px", "14px"]
baseRadius = "12px"
buttonRadius = "10px"
linkUnderline = false
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#2446c8"
backgroundColor = "#f4f2ec"
secondaryBackgroundColor = "#f8f6f1"
textColor = "#1c1b19"
linkColor = "#2446c8"
borderColor = "#e4e0d6"
dataframeHeaderBackgroundColor = "#f8f6f1"
dataframeBorderColor = "#e4e0d6"
codeBackgroundColor = "#f8f6f1"
redColor = "#c2352b"
greenColor = "#1f8a4c"
orangeColor = "#9a5b00"
yellowColor = "#9a7a00"
blueColor = "#2446c8"
violetColor = "#6a4fc8"
grayColor = "#878379"
chartCategoricalColors = ["#2446c8", "#878379"]

[theme.light.sidebar]
backgroundColor = "#f4f2ec"
secondaryBackgroundColor = "#fffefb"
borderColor = "#e4e0d6"

[theme.dark]
primaryColor = "#7592ff"
backgroundColor = "#121211"
secondaryBackgroundColor = "#1b1b19"
textColor = "#f1eee7"
linkColor = "#91a8ff"
borderColor = "#2e2d2a"
dataframeHeaderBackgroundColor = "#1b1b19"
dataframeBorderColor = "#2e2d2a"
codeBackgroundColor = "#222220"
redColor = "#ff6b5e"
greenColor = "#4cc27e"
orangeColor = "#f0b64d"
yellowColor = "#e8c547"
blueColor = "#7592ff"
violetColor = "#a08cff"
grayColor = "#8f8b82"
chartCategoricalColors = ["#7592ff", "#8f8b82"]

[theme.dark.sidebar]
backgroundColor = "#121211"
secondaryBackgroundColor = "#1b1b19"
borderColor = "#2e2d2a"

[client]
# Cache le bouton « Deploy » et les menus de développement.
toolbarMode = "minimal"
