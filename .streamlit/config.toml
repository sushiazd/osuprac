# Thème aux couleurs d'osu! (rose), en clair et en sombre.
# Le mode se choisit dans le menu ⋮ > Settings du tableau de bord.

[theme]
font = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
headingFontWeights = [800, 800, 700, 700, 600, 600]
headingFontSizes = ["34px", "26px", "20px", "17px", "15px", "13px"]
baseRadius = "12px"
buttonRadius = "full"
linkUnderline = false
showSidebarBorder = false

[theme.light]
primaryColor = "#d6336c"
linkColor = "#c2185b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f1f5"
textColor = "#1f1a24"
borderColor = "#eadfe6"
chartCategoricalColors = ["#d6336c", "#3b82f6", "#f59e0b", "#10b981", "#8b5cf6", "#06b6d4"]

[theme.light.sidebar]
backgroundColor = "#fbf6f9"
secondaryBackgroundColor = "#f3e9ef"
borderColor = "#eadfe6"

[theme.dark]
primaryColor = "#d6336c"
linkColor = "#ff66aa"
backgroundColor = "#17141f"
secondaryBackgroundColor = "#221d2d"
textColor = "#f3eef7"
borderColor = "#342c42"
chartCategoricalColors = ["#ff66aa", "#60a5fa", "#fbbf24", "#34d399", "#a78bfa", "#22d3ee"]

[theme.dark.sidebar]
backgroundColor = "#110e18"
secondaryBackgroundColor = "#1c1726"
borderColor = "#2a2336"
