# Thème « lazer » : sombre, rose osu!, inspiré de l'interface d'osu! lazer.
# Les effets (fond animé, cartes, néons) sont dans osuprog/theme.css.

[theme]
base = "dark"
primaryColor = "#e8448f"
backgroundColor = "#0e0a15"
secondaryBackgroundColor = "#1a1324"
textColor = "#f3eefa"
linkColor = "#ff7ab8"
borderColor = "#2c2340"
showWidgetBorder = true
showSidebarBorder = false
font = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
headingFont = "'Exo 2':https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
headingFontWeights = [900, 800, 800, 700, 700, 600]
headingFontSizes = ["40px", "28px", "22px", "18px", "15px", "13px"]
baseRadius = "14px"
buttonRadius = "full"
linkUnderline = false
dataframeHeaderBackgroundColor = "#1f1730"
dataframeBorderColor = "#2c2340"
redColor = "#ff4f6f"
orangeColor = "#ffaa33"
yellowColor = "#ffd23f"
greenColor = "#5cf08f"
blueColor = "#66ccff"
violetColor = "#aa88ff"
grayColor = "#8d80a3"
chartCategoricalColors = ["#ff66aa", "#66ccff", "#ffaa33", "#5cf08f", "#aa88ff", "#4fdbc6"]

[theme.sidebar]
backgroundColor = "#0a0710"
secondaryBackgroundColor = "#17111f"
borderColor = "#241c33"
