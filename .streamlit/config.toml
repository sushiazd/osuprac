# Thème sobre : fond neutre, une seule couleur d'accent (le rose d'osu!), police Inter.
# Les quelques styles en plus sont dans osuprog/theme.css.

[theme]
base = "dark"
primaryColor = "#ff5fa2"
backgroundColor = "#111114"
secondaryBackgroundColor = "#1a1a1f"
textColor = "#ececf1"
linkColor = "#ff8cbd"
borderColor = "#27272e"
showWidgetBorder = true
showSidebarBorder = true
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["28px", "19px", "16px", "15px", "14px", "13px"]
baseRadius = "12px"
buttonRadius = "10px"
linkUnderline = false
dataframeHeaderBackgroundColor = "#17171c"
dataframeBorderColor = "#27272e"
redColor = "#f2626f"
greenColor = "#45c98b"
orangeColor = "#e8a33d"
yellowColor = "#e8c547"
blueColor = "#6aa8ff"
violetColor = "#a08cff"
grayColor = "#8b8b96"
chartCategoricalColors = ["#ff5fa2", "#8b8b96"]

[theme.sidebar]
backgroundColor = "#0d0d10"
secondaryBackgroundColor = "#17171c"
borderColor = "#1f1f25"

[client]
# Cache le bouton « Deploy » et les menus de développement.
toolbarMode = "minimal"
